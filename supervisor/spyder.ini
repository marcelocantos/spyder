; Spyder HTTP MCP on :3030.
; Template: supervisor/install.sh writes supervisor.d/spyder.ini with @REPO@ expanded.
; The program runs the Homebrew Cellar binary (day-to-day MCP). Tree-built
; spyder stays off :3030 — use :3131 for unreleased code.

[program:spyder]
command=@REPO@/supervisor/run-spyder.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin",SPYDER_ADDR=":3030"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/spyder.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
